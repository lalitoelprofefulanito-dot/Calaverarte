ude",title:"3. Preparar el prompt para Claude",tool:"ChatGPT",purpose:"Solicitar la consolidación de lo acordado en una instrucción integral de desarrollo.",text:"Dame en un prompt todo lo que me has explicado hasta ahora en esta conversación para que Claude IA realice el diseño del código y cree toda la app ya completa"},{id:"prompt-maestro",title:"4. Prompt maestro de implementación",tool:"Claude (prompt preparado con apoyo de ChatGPT)",purpose:"Solicitar la construcción de una aplicación modular completa, con motor local de calaveritas, editor, evaluación, modo educativo, biblioteca IndexedDB, diseñador, exportación, pruebas, documentación y publicación verificable.",text:`PROMPT MAESTRO PARA CLAUDE IA — CALAVERARTE

Actúa como arquitecto de software, ingeniero frontend, especialista en algoritmos de rima, diseñador UX/UI y responsable de calidad. Diseña, programa, integra, prueba y documenta CalaverArte como aplicación web completa; no te limites a entregar un plan o una maqueta.

Decisiones del producto: aplicación web adaptable; público general y educativo; prototipo inicial sin API de IA; generación mediante reglas, patrones narrativos y vocabulario local; almacenamiento en IndexedDB y preferencias en localStorage; arquitectura modular con Vite, JavaScript ES modules, Vitest y Playwright.

Implementa estas áreas: generador personalizable; motor literario local; editor por versos y estrofas; bloqueo de estrofas, deshacer y rehacer; versionado y comparación; evaluador literario no destructivo; perfiles y actividades educativas; biblioteca, favoritos y búsqueda; diseñador visual; impresión, exportación e importación JSON; configuración, accesibilidad, privacidad y gestión de errores.

Organiza el código por módulos y responsabilidades. Mantén separados interfaz, motor literario, almacenamiento, evaluación y exportación. No concentres todo en un archivo monolítico ni dejes funciones huérfanas, código muerto o botones sin acción. Valida todos los datos importados y evita insertar texto de usuario como HTML ejecutable.

El motor deberá usar datos del protagonista, construir una secuencia narrativa coherente, diversificar patrones, evitar repeticiones, buscar rimas naturales y reconocer que la métrica y la evaluación automática tienen limitaciones. No lo presentes como inteligencia artificial generativa. No envíes poemas a servicios externos. Deja preparada una interfaz desacoplada para una futura integración de IA, pero mantenla inactiva.
